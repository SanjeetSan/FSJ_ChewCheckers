# Smart Nutrition microservices stack - MySQL Version

services:
  # MySQL databases
  auth-db:
    image: mariadb:11
    container_name: smart-nutrition-auth-db
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: auth_db
      MYSQL_USER: auth_user
      MYSQL_PASSWORD: auth_pass
    volumes:
      - auth-db-data:/var/lib/mysql
    networks:
      - smart-nutrition-net
    restart: unless-stopped

  meal-db:
    image: mariadb:11
    container_name: smart-nutrition-meal-db
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: meal_db
      MYSQL_USER: meal_user
      MYSQL_PASSWORD: meal_pass
    volumes:
      - meal-db-data:/var/lib/mysql
    networks:
      - smart-nutrition-net
    restart: unless-stopped

  school-db:
    image: mariadb:11
    container_name: smart-nutrition-school-db
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: school_db
      MYSQL_USER: school_user
      MYSQL_PASSWORD: school_pass
    volumes:
      - school-db-data:/var/lib/mysql
    networks:
      - smart-nutrition-net
    restart: unless-stopped

  messaging-db:
    image: mariadb:11
    container_name: smart-nutrition-messaging-db
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: messaging_db
      MYSQL_USER: messaging_user
      MYSQL_PASSWORD: messaging_pass
    volumes:
      - messaging-db-data:/var/lib/mysql
    networks:
      - smart-nutrition-net
    restart: unless-stopped

  # Eureka Service Registry
  eureka-server:
    image: smart-nutrition-eureka:latest
    container_name: smart-nutrition-eureka
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=eureka
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
      - SERVER_PORT=8761
    networks:
      - smart-nutrition-net
    restart: unless-stopped

  # Auth Service
  auth-service:
    image: smart-nutrition-backend-auth-service:latest
    container_name: smart-nutrition-auth
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8081
      - SPRING_DATASOURCE_URL=jdbc:mysql://auth-db:3306/auth_db?useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=auth_user
      - SPRING_DATASOURCE_PASSWORD=auth_pass
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MySQL8Dialect
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE=http://eureka-server:8761/eureka/
      - EUREKA_INSTANCE_HOSTNAME=auth-service
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=false
    depends_on:
      - auth-db
      - eureka-server
    networks:
      - smart-nutrition-net
    restart: unless-stopped

  # Meal Service
  meal-service:
    image: smart-nutrition-backend-meal-service:latest
    container_name: smart-nutrition-meal
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8082
      - SPRING_DATASOURCE_URL=jdbc:mysql://meal-db:3306/meal_db?useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=meal_user
      - SPRING_DATASOURCE_PASSWORD=meal_pass
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MySQL8Dialect
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE=http://eureka-server:8761/eureka/
      - EUREKA_INSTANCE_HOSTNAME=meal-service
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=false
    depends_on:
      - meal-db
      - eureka-server
    networks:
      - smart-nutrition-net
    restart: unless-stopped

  # School Service
  school-service:
    image: smart-nutrition-backend-school-service:latest
    container_name: smart-nutrition-school
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8083
      - SPRING_DATASOURCE_URL=jdbc:mysql://school-db:3306/school_db?useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=school_user
      - SPRING_DATASOURCE_PASSWORD=school_pass
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MySQL8Dialect
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE=http://eureka-server:8761/eureka/
      - EUREKA_INSTANCE_HOSTNAME=school-service
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=false
    depends_on:
      - school-db
      - eureka-server
    networks:
      - smart-nutrition-net
    restart: unless-stopped

  # Messaging Service
  messaging-service:
    image: smart-nutrition-backend-messaging-service:latest
    container_name: smart-nutrition-messaging
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8084
      - SPRING_DATASOURCE_URL=jdbc:mysql://messaging-db:3306/messaging_db?useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=messaging_user
      - SPRING_DATASOURCE_PASSWORD=messaging_pass
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MySQL8Dialect
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE=http://eureka-server:8761/eureka/
      - EUREKA_INSTANCE_HOSTNAME=messaging-service
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=false
    depends_on:
      - messaging-db
      - eureka-server
    networks:
      - smart-nutrition-net
    restart: unless-stopped

  # API Gateway
  gateway:
    image: smart-nutrition-backend:latest
    container_name: smart-nutrition-gateway
    ports:
      - "8088:8088"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8088
      - EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE=http://eureka-server:8761/eureka/
      - EUREKA_INSTANCE_HOSTNAME=gateway
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=false
    depends_on:
      - eureka-server
    networks:
      - smart-nutrition-net
    restart: unless-stopped

  # React Frontend
  frontend:
    image: smart-nutrition-frontend:latest
    container_name: smart-nutrition-frontend
    ports:
      - "80:80"
    environment:
      - REACT_APP_API_URL=http://localhost:8088
    depends_on:
      - gateway
    networks:
      - smart-nutrition-net
    restart: unless-stopped

volumes:
  auth-db-data:
  meal-db-data:
  school-db-data:
  messaging-db-data:

networks:
  smart-nutrition-net:
    driver: bridge
