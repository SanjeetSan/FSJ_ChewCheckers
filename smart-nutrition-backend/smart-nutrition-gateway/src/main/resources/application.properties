server.port=8088
spring.application.name=API-GATEWAY-SERVICE
spring.config.import=optional:file:../secrets.properties

# Gateway has NO database and NO security filter — disable all auto-configs
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

eureka.instance.prefer-ip-address=true


eureka.instance.status-page-url-path=/swagger-ui/index.html
management.endpoints.web.exposure.include=*
# Gateway Route Definitions (Routes requests from port 8088 to microservices)
spring.cloud.gateway.routes[0].id=auth-admin-route
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**,/api/admin/**,/api/users/**,/uploads/**

spring.cloud.gateway.routes[1].id=meal-vision-route
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/meals/**,/api/assistant/**

spring.cloud.gateway.routes[2].id=school-report-route
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/teacher/**,/api/parent/**,/api/reports/**

spring.cloud.gateway.routes[3].id=messaging-social-route
spring.cloud.gateway.routes[3].uri=http://localhost:8084
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/messages/**,/api/social/**

